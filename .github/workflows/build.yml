name: Build
run-name: Production Build by ${{ github.actor }}
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    # Skip CI if 'skip ci' is contained in latest commit message
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
    - uses: actions/checkout@v3

    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        channels: conda-forge, defaults
        auto-activate-base: true
        activate-environment: ""

    - name: Source Miniconda
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate
        echo "Using python from $(which python)"
        python --version
        echo "CONDA set to $CONDA"
        conda install -n base conda-libmamba-solver
        conda config --set solver libmamba

    - name: Install abismal
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda create -qyn abismal -c conda-forge python=${{ matrix.python-version }} dials \
          "numpy<2.4" "pandas<2.4" "scipy<1.18"
        conda activate abismal
        echo "Using python from $(which python)"
        python --version
        echo "Using pip from ... $(which pip)"
        pip install -q --upgrade pip
        # The runners have no GPU, so take the CPU build of torch: a fraction of
        # the size of the CUDA wheels, which matters on a runner with a small
        # disk. One pass with an extra index rather than a separate torch install
        # first: torchref caps torch, and a CPU torch newer than that cap would be
        # replaced by the CUDA build from PyPI. The CPU wheels carry a `+cpu`
        # local version, which outranks PyPI's for the same release.
        pip install -qe ".[dev,torchref,gui]" --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Report the installed stack
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate abismal
        python -c "
        import numpy, torch, torchref, dxtbx
        print(f'numpy {numpy.__version__}')
        print(f'torch {torch.__version__}  torchref {torchref.__version__}')
        print(f'dxtbx {dxtbx.__file__}')
        "

    - name: Check that TensorFlow is not installed
      # abismal no longer uses it. Nothing should pull it back in, and a test
      # that passes only because some dependency dragged it along should fail.
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate abismal
        python -c "import importlib.util, sys; sys.exit('tensorflow is installed' if importlib.util.find_spec('tensorflow') else 0)"

    - name: Run tests with pytest
      env:
        # tests/gui skips itself when ipywidgets is missing, so that a stock
        # `pip install -e .[dev]` checkout still runs the suite. In CI the GUI extra is
        # installed above, so a missing dependency has to be a hard failure -- without
        # this the whole GUI suite would quietly shrink to nothing and stay that way.
        ABISMAL_REQUIRE_GUI_TESTS: "1"
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate abismal
        echo "Using python from $(which python)"
        python --version
        echo "Using pytest from ... $(which pytest)"
        pytest

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
