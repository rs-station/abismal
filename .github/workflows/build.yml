name: Build
run-name: Production Build by ${{ github.actor }}
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: [ubuntu-latest]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    # Skip CI if 'skip ci' is contained in latest commit message
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
    - uses: actions/checkout@v3

    - name: Install Miniconda
      uses: conda-incubator/setup-miniconda@v3
      with:
        miniconda-version: "latest"
        channels: conda-forge, defaults
        auto-activate-base: true
        activate-environment: ""

    - name: Source Miniconda
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate
        echo "Using python from $(which python)"
        python --version
        echo "CONDA set to $CONDA"
        conda install -n base conda-libmamba-solver
        conda config --set solver libmamba

    - name: Install abismal
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda create -qyn abismal -c conda-forge python=${{ matrix.python-version }} dials \
          "pandas<2.4" "scipy<1.18"
        conda activate abismal
        echo "Using python from $(which python)"
        python --version
        echo "Using pip from ... $(which pip)"
        pip install -q --upgrade pip
        # Refinement runs on CPU, and the runners have no GPU, so take the CPU
        # build of torch. It is a fraction of the size of the CUDA wheels, which
        # matters on a runner with a small disk. Installing it first means the
        # torchref extra finds torch>=2.4.0 already satisfied and leaves it be.
        pip install -q torch --index-url https://download.pytorch.org/whl/cpu
        pip install -qe ".[dev,torchref]"

    - name: Report the installed stack
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate abismal
        python -c "
        import numpy, tensorflow, torch, torchref, dxtbx
        print(f'numpy {numpy.__version__}  tensorflow {tensorflow.__version__}')
        print(f'torch {torch.__version__}  torchref {torchref.__version__}')
        print(f'dxtbx {dxtbx.__file__}')
        "

    - name: Run tests with pytest
      run: |
        source $CONDA/etc/profile.d/conda.sh
        conda activate abismal
        echo "Using python from $(which python)"
        python --version
        echo "Using pytest from ... $(which pytest)"
        pytest

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
