[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "abismal"
authors=[
    {name="Kevin M. Dalton", email="kmdalton@slac.stanford.edu"}
]
description = "Stochastic merging for diffraction data."
readme = "README.md"
dynamic = ["version"]
# Colab moved to 3.13; the old <3.13 ceiling excluded the runtime this GUI targets.
requires-python = ">= 3.9,<3.14"
dependencies = [
    "reciprocalspaceship>=0.9.16",
    "tqdm",
    "tensorflow-probability[tf]==0.25",
    # A range, not a pin. `==2.18.0` made abismal uninstallable on Google Colab:
    # TF 2.18 caps ml-dtypes below 0.5, Colab's preinstalled jax requires 0.5 or
    # newer, and TF 2.18's lite/python/util.py imports jax unconditionally -- so
    # `import tensorflow` raised ValueError before any of our code ran. Invisible
    # anywhere jax is absent, which is every developer environment here.
    #
    # Verified against the official Colab image on 2.20: the test suite passes,
    # a merge runs end to end, and torch/torchref import alongside TF in one
    # process without the segfault seen elsewhere. 2.19 falls in the range and is
    # untested.
    "tensorflow>=2.18,<2.21",
    "matplotlib",
    "seaborn",
    "rs-booster",
    # tensorflow 2.18 caps numpy at <2.1, and scikit-image >=0.25 pulls a tifffile
    # that requires numpy>=2.1. Left unpinned, `pip install abismal` resolves
    # scikit-image to a release that drags numpy above tensorflow's ceiling and
    # breaks the install.
    #
    # Marked, not absolute: scikit-image 0.24 has no cp313 wheel, so on Python 3.13
    # this pin sent pip to a 22.7 MB source tarball that fails to build its own
    # metadata -- five minutes to a dead end, which is how it presented on Colab.
    # The ceiling cannot bind on 3.13 anyway, since TF 2.18 has no cp313 wheel for
    # a resolution to land on, so the marker costs nothing where it is dropped.
    # Two entries, not one marked entry: a marker that fails drops the requirement
    # altogether rather than relaxing it, and abismal needs skimage either way --
    # _torchref_worker imports peak_local_max lazily, so losing it would not fail
    # the install or the import, only a torchref run, halfway through.
    "scikit-image<0.25; python_version < '3.13'",
    "scikit-image; python_version >= '3.13'",
    "ray",
]

license={text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest", 
    "pytest-cov",
    "pytest-xdist",
]
cuda = [
    "tensorflow[and-cuda]>=2.18,<2.21",
]
# Per-epoch refinement via --torchref-pdb. Optional because it pulls torch, which
# is large and irrelevant to a plain merging run. Installing it puts torchref in
# the same interpreter as abismal, so no separate environment is needed.
torchref = [
    "torch>=2.4.0",
    "torchref>=0.6.0",
]
# The notebook GUI (abismal/gui/, abismal_gui.ipynb). Optional because it pulls a
# widget stack the merging code never touches, and a headless CLI or cluster run
# has no use for it.
#
# The widgets only. JupyterLab is a separate extra -- see [lab] below -- because
# this is what a notebook needs *anywhere*, and on Colab the frontend is already
# there. Measured in the official Colab image, jupyterlab drags in six more
# packages (jupyterlab, jupyterlab_server, jupyter-lsp, json5, async-lru,
# jupyter_builder) that a live Colab kernel has no use for.
#
# Not listed, deliberately:
#   google.colab - present on Colab and nowhere else, and every use is guarded by
#                  try/except, so declaring it would make the extra uninstallable
#                  off Colab.
#   matplotlib, pandas, reciprocalspaceship - already required by abismal itself.
#   solara - its only importer is components/file_browser.py, which is dead code
#            (see the coverage omit below). Dropping it takes a large dependency
#            off every install, and Colab installs into a live kernel where every
#            package that need not change is one that cannot break it. Revive this
#            alongside file_browser.py if that ever comes back.
gui = [
    # 7 as well as 8, because Colab ships 7.7.1 and its widget manager cannot
    # render what 8 emits: the opt-in CDN manager is pinned to an ipywidgets-8
    # alpha lacking HTMLStyleModel and TextStyleModel, so every Text and HTML
    # widget fails to create a model and the form renders as an empty cell.
    # components/_compat.py papers over the one API difference we rely on.
    "ipywidgets>=7.7,<9",
    "ipython",
]
# JupyterLab, for running the notebook locally via the `abismal.gui` launcher.
#
# It also brings jupyter_server, which the form consults to find the directory
# jupyter was launched from. Without it that lookup falls back to JPY_PARENT_PID
# and /proc, which covers the ordinary case, so [gui] alone still resolves paths
# sensibly -- it just has one fewer source to ask.
#
# `abismal.gui` exits with instructions when it cannot find a jupyter to launch,
# so installing only [gui] fails loudly rather than strangely.
lab = [
    "jupyterlab>=4",
]

[project.urls]
Repository = "https://github.com/rs-station/abismal"
Issues = "https://github.com/rs-station/abismal/issues"

[project.scripts]
abismal = "abismal.command_line.abismal:main"
"abismal.cchalf" = "abismal.command_line.cchalf:main"
"abismal.friedelize" = "abismal.command_line.friedelize:main"
"abismal.plot_history" = "abismal.command_line.plot_history:main"
# Copies the packaged notebook into the current directory and starts JupyterLab
# on it, so there is no path to know and nothing to symlink.
"abismal.gui" = "abismal.command_line.gui:main"

[tool.coverage.run]
source = ["abismal"]
# The runner tails its log, polls, and reaps the child on daemon threads. Without this
# every line they execute reports as uncovered.
concurrency = ["thread"]
omit = [
    # Dead code: nothing imports it, components/__init__.py does not export it, and it
    # is the package's only consumer of solara. Counting it would depress the coverage
    # delta for a file no one runs. Drop this line if it is ever revived or deleted.
    "abismal/gui/components/file_browser.py",
]

[tool.coverage.report]
exclude_also = [
    # Colab- and JupyterLab-only branches. Both imports are guarded on purpose and
    # neither is available in CI, so these are unreachable there by design.
    "except ImportError:",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
# No --cov-config: coverage finds [tool.coverage.*] in this file on its own. It used to
# name .coveragerc, which did not exist -- .gitignore's `.coverage*` had been swallowing
# it, so anyone who wrote one had git ignore it silently.
addopts = "-n auto --cov=abismal --cov-report xml"
testpaths = [
    "tests",
]
# The GUI test suite and the developer snapshot CLI share one harness. Putting
# devtools/ on the path here lets tests import it without sys.path juggling in a
# conftest, and keeps it out of the wheel -- `packages.find` below names abismal*
# explicitly, so a top-level devtools/ is not packaged.
pythonpath = [
    "devtools",
]

[tool.setuptools.packages.find]
# Explicit, not auto-discovered. This is a flat layout, so setuptools's default
# discovery treats every top-level directory as a candidate package and refuses
# to build as soon as there is more than one -- a stray `notes/`, `jobs/` or
# scratch directory in a working copy is enough to break `python -m build`.
# Naming the package makes the build depend only on tracked source.
include = ["abismal*"]

[tool.setuptools.package-data]
# The notebook ships inside the package so `abismal.gui` can copy it into
# whatever directory the user is standing in. At the repo root it was not
# packaged at all, so `pip install abismal[gui]` installed JupyterLab and the
# widgets but nothing to open in them.
"abismal.gui" = ["*.ipynb"]

[tool.setuptools.dynamic]
version = {file = "abismal/VERSION"}
